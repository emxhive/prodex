name: Publish npm

on:
  workflow_dispatch:
    inputs:
      expected-version:
        description: Expected package.json version to publish
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    concurrency:
      group: npm-publish-${{ github.ref_name }}-${{ inputs.expected-version }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: npm ci

      - name: Verify package version
        env:
          EXPECTED_VERSION: ${{ inputs.expected-version }}
        run: |
          version="$(node -p "require('./package.json').version")"

          if [ "$version" != "$EXPECTED_VERSION" ]; then
            echo "package.json version $version does not match expected version $EXPECTED_VERSION."
            exit 1
          fi

      - run: npm test
      - run: npm run pack:check
      - run: npm publish